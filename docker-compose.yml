version: '3.8'

services:

  # RabbitMQ 
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"    
      - "15672:15672"  
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - wishwordrobe-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - wishwordrobe-network
    restart: unless-stopped

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - clothes-service
      - weather-service
      - notification-service
    networks:
      - wishwordrobe-network
    restart: unless-stopped

  clothes-service:
    build:
      context: ./clothes-service
      dockerfile: Dockerfile
    container_name: clothes-service
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: rabbitmq
      
      
    volumes:
      - clothes-uploads:/app/uploads
    depends_on:
      rabbitmq:
        condition: service_healthy
       
    networks:
      - wishwordrobe-network
    restart: unless-stopped

  weather-service:
    build:
      context: ./weather-service
      dockerfile: Dockerfile
    container_name: weather-service
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: rabbitmq
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - wishwordrobe-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: rabbitmq
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./notification-service/src/main/resources/service-account-key.json:/app/service-account-key.json:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - wishwordrobe-network
    restart: unless-stopped

  wishwardrobe-front:
    build:
      context: ../wishwardrobe-front
      args:
        - VUE_APP_KAKAO_JS_KEY=${VUE_APP_KAKAO_JS_KEY}
      dockerfile: Dockerfile
    container_name: wishwardrobe-front
    ports:
      - "3000:80"
    env_file:
      - .env
    depends_on:
      - gateway-service
    networks:
      - wishwordrobe-network
    restart: unless-stopped

networks:
  wishwordrobe-network:
    driver: bridge

volumes:
  clothes-uploads:
