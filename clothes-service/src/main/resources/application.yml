server:
  port: 8081
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:clothes}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  cache:
    # // spring.cache 위치가 맞음. 기존엔 file 하위에 있었음
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=30m
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379 
 
services:
  weather:
    url: ${WEATHER_SERVICE_URL:http://localhost:8082/api/v1}
    # // 환경변수 있으면 사용, 없으면 로컬 기본값

file:
  uploadFiles: /app/uploads
  imageBaseUrl: ${IMAGE_BASE_URL:http://localhost:8081/api/clothes/images/}

logging:
  level:
    today.wishwordrobe: DEBUG
    org.springframework.cache: DEBUG
    org.springframework.amqp: DEBUG